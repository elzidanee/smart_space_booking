<style>
        .perforated-line {
            background-image: radial-gradient(circle at 100% 50%, transparent 8px, #e9e8e6 9px, #e9e8e6 10px, transparent 11px), radial-gradient(circle at 0% 50%, transparent 8px, #e9e8e6 9px, #e9e8e6 10px, transparent 11px);
            background-size: 100% 20px, 100% 20px;
            background-repeat: repeat-y, repeat-y;
            background-position: left center, right center;
        }
        .dash-line {
            border-top: 2px dashed #dadad8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md h-screen flex flex-col antialiased">
<!-- Header -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-desktop w-full h-16 bg-surface shrink-0">
<div class="w-10"></div> <!-- Spacer for centering -->
<h1 class="font-title-lg text-title-lg text-on-surface">E-Ticket</h1>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile md:px-margin-desktop py-stack-md flex flex-col items-center justify-center">
<!-- Ticket Container -->
<div class="w-full max-w-sm relative rounded-ticket bg-surface-container-lowest shadow-warm-soft overflow-hidden">
<!-- Accent Stripe -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<!-- Top Section -->
<div class="p-stack-lg flex flex-col items-center pt-8">
<!-- Status Badge -->
<div class="absolute top-6 right-6 px-3 py-1 rounded-full bg-secondary-container flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-emphasis text-body-emphasis text-on-secondary-container">Disetujui</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-secondary text-center mb-6 mt-4">Moklet Hub Coworking Space</h2>
<div class="w-48 h-48 bg-surface-container-low rounded-lg flex items-center justify-center mb-4 p-2">
<!-- Fake QR Code Pattern -->
<img alt="QR Code" class="w-full h-full object-contain mix-blend-multiply opacity-80" data-alt="A high-contrast, perfectly square, sharp black and white QR code image on a pure white background, generating a sense of digital access and modern technology within a coworking space application context, brightly lit without shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEOCXMW5PDqlixObpU6qfZSt9XY3KoMVYt1xp4bHNZRRSR54ZfHfMzVDKtU_TNL0b_f6OLrQHyJ9nVm4b-Z74OCRNl5_119e28rikYmf7ktxVp2VHDblpMftgJE2RUVvjv1aWwSY5tTPcj-W797Owpu_UtbsxfXuLPnK_vcnXKO9Tw9IeSlE6bhlvNTQ-QLycIvOH98TmfN4NQbgK4YIXIUNqyRn0sVAV7tFhwhgbA6-BjbeBq1DhtAQ"/>
</div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Booking Code</p>
<p class="font-mono font-bold text-lg text-on-surface tracking-widest">#BOOK-20260830-0012</p>
</div>
<!-- Perforation Section -->
<div class="relative h-10 w-full bg-surface-container-lowest flex items-center justify-center overflow-hidden">
<div class="absolute left-[-10px] w-5 h-5 bg-background rounded-full z-10 shadow-inner border border-surface-container-high/50"></div>
<div class="w-[calc(100%-40px)] dash-line"></div>
<div class="absolute right-[-10px] w-5 h-5 bg-background rounded-full z-10 shadow-inner border border-surface-container-high/50"></div>
</div>
<!-- Details Section -->
<div class="p-stack-lg bg-surface-container-lowest">
<div class="space-y-4">
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface-variant">Space</span>
<span class="font-body-emphasis text-body-emphasis text-on-surface text-right">Private Office Suite B</span>
</div>
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface-variant">Tanggal</span>
<span class="font-body-emphasis text-body-emphasis text-on-surface text-right">30 Agustus 2026</span>
</div>
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface-variant">Jam</span>
<span class="font-body-emphasis text-body-emphasis text-on-surface text-right">09:00 - 12:00</span>
</div>
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface-variant">Durasi</span>
<span class="font-body-emphasis text-body-emphasis text-on-surface text-right">3 Jam</span>
</div>
<div class="pt-4 border-t border-surface-variant flex justify-between items-center mt-2">
<span class="font-body-md text-body-md text-on-surface-variant">Total</span>
<span class="font-title-lg text-title-lg text-primary tabular-nums">Rp 240.000</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-sm mt-stack-lg flex gap-4">
<button class="flex-1 h-12 rounded-[12px] border border-outline text-on-surface font-body-emphasis text-body-emphasis flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors relative overflow-hidden group">
<span class="absolute inset-0 bg-on-surface opacity-0 group-hover:opacity-10 transition-opacity"></span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">download</span>
                Unduh
            </button>
<button class="flex-1 h-12 rounded-[12px] bg-primary text-on-primary font-body-emphasis text-body-emphasis flex items-center justify-center gap-2 relative overflow-hidden group shadow-sm">
<span class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity"></span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">share</span>
                Bagikan
            </button>
</div>
</main>
