<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Space - Member Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-on-surface": "#f1f1ef",
                      "on-tertiary-fixed-variant": "#51443a",
                      "inverse-primary": "#ffb693",
                      "outline": "#8b7267",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#e3e2e0",
                      "on-primary-fixed": "#351000",
                      "on-error-container": "#93000a",
                      "on-secondary-container": "#276d67",
                      "on-secondary-fixed-variant": "#00504a",
                      "tertiary-fixed": "#f3dfd0",
                      "surface-bright": "#faf9f7",
                      "surface-tint": "#a04100",
                      "surface-dim": "#dadad8",
                      "surface": "#faf9f7",
                      "on-surface": "#1a1c1b",
                      "inverse-surface": "#2f3130",
                      "tertiary-fixed-dim": "#d6c3b5",
                      "tertiary-container": "#827367",
                      "error": "#ba1a1a",
                      "primary": "#9d4000",
                      "tertiary": "#685a4f",
                      "surface-container-high": "#e9e8e6",
                      "secondary-fixed": "#abefe7",
                      "outline-variant": "#dec0b3",
                      "surface-container-low": "#f4f3f1",
                      "on-secondary-fixed": "#00201d",
                      "secondary": "#216962",
                      "on-tertiary-container": "#fffeff",
                      "on-primary-fixed-variant": "#7a3000",
                      "on-tertiary": "#ffffff",
                      "background": "#faf9f7",
                      "primary-container": "#c2540e",
                      "on-surface-variant": "#574238",
                      "primary-fixed-dim": "#ffb693",
                      "on-tertiary-fixed": "#231a11",
                      "on-secondary": "#ffffff",
                      "secondary-container": "#a8ece4",
                      "surface-variant": "#e3e2e0",
                      "secondary-fixed-dim": "#8fd3cb",
                      "on-primary-container": "#fffdff",
                      "surface-container": "#efeeec",
                      "on-background": "#1a1c1b",
                      "on-primary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#ffdbcc"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "margin-desktop": "24px",
                      "unit": "4px",
                      "gutter": "16px",
                      "stack-lg": "24px",
                      "stack-sm": "8px",
                      "stack-md": "16px"
              },
              "fontFamily": {
                      "body-emphasis": ["Inter"],
                      "headline-md": ["Sora"],
                      "body-md": ["Inter"],
                      "display-lg": ["Sora"],
                      "label-md": ["Inter"],
                      "headline-sm": ["Sora"],
                      "headline-lg": ["Sora"],
                      "title-lg": ["Sora"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "body-emphasis": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center md:bg-surface-container">
<!-- Main Container -->
<main class="w-full max-w-[480px] md:bg-surface-bright md:rounded-3xl md:shadow-lg md:p-8 flex flex-col px-margin-mobile py-8 h-screen md:h-auto overflow-y-auto">
<!-- Header Section -->
<header class="flex flex-col items-center mb-stack-lg text-center mt-8 md:mt-0">
<div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-on-primary-container text-[24px]">corporate_fare</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Smart Space Booking</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ruang kerja fleksibel, kapan saja</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Username Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant transition-colors outline-none" id="username" name="username" placeholder="Masukkan username Anda" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-10 pr-12 py-3 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant transition-colors outline-none" id="password" name="password" placeholder="Masukkan password Anda" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1 rounded-full hover:bg-surface-container-highest transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-stack-sm">
<a class="inline-flex items-center gap-1 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">info</span>
                    Lupa Password?
                </a>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-xl font-body-emphasis text-body-emphasis hover:bg-opacity-90 active:scale-[0.98] transition-all mt-stack-sm flex justify-center items-center" type="submit">
                Masuk
            </button>
</form>
<!-- Divider -->
<div class="flex items-center w-full my-stack-lg gap-4">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-body-md text-body-md text-on-surface-variant">atau</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Secondary CTA -->
<button class="w-full bg-transparent text-primary border border-primary py-3 px-6 rounded-xl font-body-emphasis text-body-emphasis hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all flex justify-center items-center" type="button">
            Daftar sebagai Member
        </button>
<!-- Spacer for mobile layout -->
<div class="flex-grow"></div>
<!-- Footer -->
<footer class="mt-8 mb-4 text-center">
<a class="inline-block font-body-md text-body-md text-secondary hover:text-on-secondary-container transition-colors p-2 hover:bg-secondary-container rounded-lg" href="#">
                Saya seorang pengelola space, masuk di sini
            </a>
</footer>
</main>
</body></html>
