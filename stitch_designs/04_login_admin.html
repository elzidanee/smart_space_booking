<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Transactional Screen: Navigation shells suppressed intentionally -->
<main class="w-full max-w-md bg-surface-bright rounded-xl shadow-[0_12px_24px_-12px_rgba(33,105,98,0.15)] border border-surface-variant overflow-hidden flex flex-col">
<!-- Illustration Header -->
<div class="w-full h-48 bg-surface-container-low relative flex items-end justify-center p-stack-md" data-alt="A clean, modern flat illustration of a professional coworking space desk environment viewed from a slight isometric angle. The scene features a sleek laptop, a stylized potted plant with organic rounded leaves, and a glowing digital tablet. The color palette predominantly uses sophisticated Deep Teal hues with subtle off-white and soft wood accents, creating a calm, high-end administrative dashboard aesthetic. Bright, soft studio lighting casts gentle warm shadows." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCc6lYpuMfsdXBTPvCv4e_yI0MfMuT6DxF3-X15TwPknNcazWpJiBiGpx6R1OMNVE8GMrIaXdemL6FmemRpGUo2yhq918AEYbbWNnl0MsC8v-cWRM6vjGlN6m1gSTYnbZVGuximx6dkgMRgZDOM1yTdKhU2TBHK4zgtE4Sa2SLFgGz56APIInD_W4R5R7zqr3LioEjQRyHHumSc86dkR4ou9tQqso4O5wumhuWhtxn4uj1WtAigXSbtrg')">
<!-- Decorative gradient overlay to ensure illustration blends into content -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-bright to-transparent opacity-80"></div>
</div>
<div class="px-stack-lg pb-stack-lg pt-stack-sm flex flex-col gap-stack-lg relative z-10">
<!-- Typography Header -->
<div class="text-center flex flex-col gap-unit">
<h1 class="font-headline-md text-headline-md text-on-surface">Login Pengelola Space</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Kelola coworking space Anda</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Username Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="username">Username</label>
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="username" name="username" placeholder="Masukkan username admin" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full pl-4 pr-12 py-3 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="Masukkan password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant hover:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-sm flex flex-col gap-stack-lg">
<button class="w-full bg-secondary text-on-secondary rounded-xl py-3 font-body-emphasis text-body-emphasis flex justify-center items-center transition-all duration-150 hover:bg-on-secondary-fixed-variant active:scale-[0.98] shadow-sm hover:shadow" type="submit">
                        Masuk
                    </button>
<div class="text-center border-t border-surface-variant pt-stack-md">
<a class="font-body-emphasis text-body-emphasis text-primary-container hover:text-primary transition-colors flex items-center justify-center gap-unit" href="#">
                            Saya seorang member, masuk di sini
                            <span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</a>
</div>
</div>
</form>
</div>
</main>
<script>
        // Simple password toggle logic for the prototype
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
