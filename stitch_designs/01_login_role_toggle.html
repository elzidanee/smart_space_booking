<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Smart Space</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f1f1ef",
                        "on-tertiary-fixed-variant": "#51443a",
                        "inverse-primary": "#ffb693",
                        "outline": "#8b7267",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e3e2e0",
                        "on-primary-fixed": "#351000",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#276d67",
                        "on-secondary-fixed-variant": "#00504a",
                        "tertiary-fixed": "#f3dfd0",
                        "surface-bright": "#faf9f7",
                        "surface-tint": "#a04100",
                        "surface-dim": "#dadad8",
                        "surface": "#faf9f7",
                        "on-surface": "#1a1c1b",
                        "inverse-surface": "#2f3130",
                        "tertiary-fixed-dim": "#d6c3b5",
                        "tertiary-container": "#827367",
                        "error": "#ba1a1a",
                        "primary": "#9d4000",
                        "tertiary": "#685a4f",
                        "surface-container-high": "#e9e8e6",
                        "secondary-fixed": "#abefe7",
                        "outline-variant": "#dec0b3",
                        "surface-container-low": "#f4f3f1",
                        "on-secondary-fixed": "#00201d",
                        "secondary": "#216962",
                        "on-tertiary-container": "#fffeff",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-tertiary": "#ffffff",
                        "background": "#faf9f7",
                        "primary-container": "#c2540e",
                        "on-surface-variant": "#574238",
                        "primary-fixed-dim": "#ffb693",
                        "on-tertiary-fixed": "#231a11",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#a8ece4",
                        "surface-variant": "#e3e2e0",
                        "secondary-fixed-dim": "#8fd3cb",
                        "on-primary-container": "#fffdff",
                        "surface-container": "#efeeec",
                        "on-background": "#1a1c1b",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#ffdbcc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-emphasis": ["Inter"],
                        "headline-md": ["Sora"],
                        "body-md": ["Inter"],
                        "display-lg": ["Sora"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Sora"],
                        "headline-lg": ["Sora"],
                        "title-lg": ["Sora"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-emphasis": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col items-center justify-center">
<main class="w-full max-w-[400px] px-margin-mobile md:px-margin-desktop flex flex-col gap-stack-lg">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-stack-sm">Smart Space</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Masuk ke akun Anda untuk melanjutkan</p>
</div>
<!-- Role Toggle -->
<div class="flex bg-surface-container-highest rounded-full p-1 w-full relative">
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md text-on-primary bg-primary shadow-sm relative z-10 transition-colors" id="btn-member">
                Member
            </button>
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface relative z-10 transition-colors" id="btn-pengelola">
                Pengelola Space
            </button>
</div>
<!-- Form Container -->
<div class="bg-surface-container-lowest rounded-[16px] shadow-[0_4px_12px_rgba(157,64,0,0.08)] p-6 w-full flex flex-col gap-stack-md border border-[#E7E3DE]">
<form class="flex flex-col gap-stack-md">
<!-- Username Field -->
<div>
<label class="font-body-emphasis text-body-emphasis text-on-surface block mb-2" for="username">Username</label>
<div class="relative">
<input class="w-full rounded-[12px] border-[#E7E3DE] focus:border-primary focus:ring-primary bg-surface text-on-surface font-body-md text-body-md py-3 px-4 outline-none placeholder:text-outline-variant transition-colors" id="username" placeholder="Masukkan username" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="font-body-emphasis text-body-emphasis text-on-surface block mb-2" for="password">Password</label>
<div class="relative">
<input class="w-full rounded-[12px] border-[#E7E3DE] focus:border-primary focus:ring-primary bg-surface text-on-surface font-body-md text-body-md py-3 px-4 pr-12 outline-none placeholder:text-outline-variant transition-colors" id="password" placeholder="Masukkan password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex justify-between items-center mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded-[4px] border-[#E7E3DE] text-primary focus:ring-primary w-4 h-4 bg-surface cursor-pointer" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant">Ingat saya</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary font-body-emphasis text-body-emphasis rounded-[12px] py-3 mt-4 shadow-[0_4px_8px_rgba(194,84,14,0.2)] hover:shadow-none hover:translate-y-[1px] transition-all relative overflow-hidden group" type="submit">
<span class="relative z-10">Masuk</span>
<div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity z-0"></div>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="text-center mt-stack-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? <a class="text-primary font-body-emphasis hover:underline transition-all" href="#">Daftar di sini</a>
</p>
</div>
</main>
<script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('password-icon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Role Toggle Logic
        const btnMember = document.getElementById('btn-member');
        const btnPengelola = document.getElementById('btn-pengelola');

        btnMember.addEventListener('click', () => {
            btnMember.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
            btnMember.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            
            btnPengelola.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm', 'bg-secondary', 'text-on-secondary');
            btnPengelola.classList.add('text-on-surface-variant', 'hover:text-on-surface');
            
            // Revert primary colors if they were changed by Pengelola
            document.documentElement.style.setProperty('--color-primary', '');
        });

        btnPengelola.addEventListener('click', () => {
            btnPengelola.classList.add('bg-secondary', 'text-on-secondary', 'shadow-sm');
            btnPengelola.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            
            btnMember.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
            btnMember.classList.add('text-on-surface-variant', 'hover:text-on-surface');
            
            // Optional: change theme colors based on role
        });
    </script>
</body></html>
